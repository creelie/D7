name: release

# Run by hand from the Actions tab (or the API) after the PR is merged: it builds
# the Lean project and checks its axioms, runs the Python, C and C++ checks of
# BLLM/checks, checks the release files, tags the chosen commit and publishes a
# GitHub release with the files in dist/ and the notes in
# .github/RELEASE_NOTES.md. Zenodo archives the release and mints a DOI when the
# repository is switched on at https://zenodo.org/account/settings/github/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib cache
        run: cd BLLM/lean && lake exe cache get
      - name: Install the Python packages
        run: python3 -m pip install --quiet numpy mpmath
      - name: Lean build and axioms; Python, C and C++ checks
        run: bash BLLM/checks/run_all.sh
      - name: Check the release files
        run: |
          for f in dist/BeyondTheLLM_final2.pdf \
                   dist/BeyondTheLLM_final2-tex.zip \
                   dist/BeyondTheLLM_final2-arxiv.tar.gz \
                   preprintBeyondTheLLM/BeyondTheLLM.pdf; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          test "$(ls preprintBeyondTheLLM)" = BeyondTheLLM.pdf
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$TARGET" \
            --title "$TAG: BLLM, the entropy cost of sound self-improvement and a typed crossing network" \
            --notes-file .github/RELEASE_NOTES.md
