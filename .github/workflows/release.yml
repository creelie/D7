name: release

# Run by hand from the Actions tab after the PR is merged. It reruns the checks, then publishes a
# GitHub release with the paper files in dist/. Zenodo archives the release and mints a DOI if the
# repository is switched on at https://zenodo.org/account/settings/github/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "Monochromatic Sublattices in Random and Cardinality Colourings of the Boolean Lattice"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Install Python packages
        run: python3 -m pip install numpy python-sat
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run all checks
        run: ./run_all.sh

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the paper files
        run: |
          for f in dist/SizeLattices_final2.pdf dist/SizeLattices_final2_tex.zip \
                   dist/SizeLattices_final2_arxiv.tar.gz; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" dist/SizeLattices_final2* \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
